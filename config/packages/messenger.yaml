framework:
    messenger:
        # Les emails sont envoyés de manière synchrone (pas de worker requis pour la démo).
        # Pour passer en asynchrone : router Symfony\Component\Mailer\Messenger\SendEmailMessage vers "async"
        # et lancer `php bin/console messenger:consume async`.
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
